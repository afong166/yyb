version: "3.3"

services:
  yyb:
    image: ghcr.io/zhuanke8/yyb:latest
    container_name: yyb
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "18273:18273"
    environment:
      YYB_USERDATA: "/data"
      YYB_HOST: "0.0.0.0"
      YYB_API_PORT: "18273"
      YYB_ADMIN_TOKEN: ""
      YYB_COOKIE_SECURE: "0"
      YYB_PANEL_TLS_VERIFY: "0"
      YYB_TRUST_PROXY: "1"
      YYB_CLIENT_IP_HEADER: "X-Real-IP"
    volumes:
      - ./data:/data
